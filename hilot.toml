# based on & copied from the official telegram app from telegram.org on a pixel 7a
[telegram]
api_id = 4
api_hash = "014b35b6184100b085b0d0572f9b5103"

app_version = "13.2.2 (73039)"
package_id = "org.telegram.messenger.web"
certificate_fingerprint = "49C1522548EBACD46CE322B6FD47F6092BB745D0F88082145CAF35E14DCC38E1"

# installed from its apk
installer = "com.google.android.packageinstaller"

device_model = "GooglePixel 7a"
system_version = "SDK 37"
perf_cat = 3

lang_code = "en"
system_lang_code = "en-ie"

timezone = "Europe/Dublin"

[database]
url = "postgresql+asyncpg:///hilot?host=${PGHOST}"

[nats]
servers = ["nats://127.0.0.1:${NATS_PORT}"]

[s3]
endpoint_url = "${GARAGE_S3_ENDPOINT}"
region = "us-east-1"

bucket = "hilot"

# must be a bit shorter than the bucket keeps a file
reuse_period = "12:00:00"

[disk]
min_free_space = "1 GiB"
postpone_delay = "0:01:00"

[bot]
concurrency = 4

max_message_age = "0:30:00"

http = {host = "127.0.0.1", port = 9101}

[downloader]
concurrency = 4

http = {host = "127.0.0.1", port = 9102}

[transcoder]
concurrency = 1

http = {host = "127.0.0.1", port = 9103}
