on:
  push:
    branches:
      - main

    paths:
      - .github/workflows/cache-devenv-sources.yaml

      - devenv.lock

      # the shared workflow reads `nixConfig`, so changes to it may affect the result
      - flake.nix

  workflow_dispatch:

jobs:
  cache-devenv-sources:
    permissions:
      id-token: write # required so niks3 can authenticate via oidc

    uses: hilorioze/nixos-dotfiles/.github/workflows/cache-devenv-sources.yaml@main
