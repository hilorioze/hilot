on:
  push:
    branches:
      - main

    paths:
      - .github/workflows/update-devenv-lock.yaml

      - devenv.yaml

      # the shared workflow reads `nixConfig`, so changes to it may affect the result
      - flake.nix

  schedule:
    # run weekly on mondays at 00:00 utc
    - cron: "0 0 * * 1"

  workflow_dispatch:

jobs:
  update-devenv-lock:
    permissions:
      id-token: write # required so niks3 can authenticate via oidc

    uses: hilorioze/nixos-dotfiles/.github/workflows/update-devenv-lock.yaml@main
    secrets: inherit # `DEVENV_UPDATE_PAT`
