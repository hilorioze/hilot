on:
  push:
    branches: &branches
      - main

  pull_request:
    branches: *branches

  workflow_dispatch:

jobs:
  test:
    concurrency:
      # one run per pull request number or branch; latest completes last
      group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}

      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hilorioze/nixos-dotfiles/.github/actions/setup-nix@main

      - run: nix run github:hilorioze/nixos-dotfiles#devenv -- test # the devenv of the shared workflows
