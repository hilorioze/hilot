on:
  push:
    branches: &branches
      - main

  pull_request:
    branches: *branches

  workflow_dispatch:

jobs:
  test:
    concurrency:
      # one run per pull request number or branch; latest completes last
      group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}

      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            accept-flake-config = true

            fsync-metadata = false # performance over durability in ci; store is transient

            fallback = true # build from source when a substituter fails mid-download instead of failing the job

      - run: |
          {
            printf 'NIX_CONFIG<<EOF\n'
            printf 'extra-substituters = %s\n' "$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-substituters')"
            printf 'extra-trusted-public-keys = %s\n' "$(nix eval --raw --file flake.nix --apply 'flake: builtins.concatStringsSep " " flake.nixConfig.extra-trusted-public-keys')"
            printf 'EOF\n'
          } >> $GITHUB_ENV

      - run: nix run --inputs-from . nixpkgs#devenv -- test
