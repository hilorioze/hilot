on:
  push:
    branches: &branches
      - main

    paths: &paths
      - .github/workflows/build.yaml

      - src/**
      - pyproject.toml
      - uv.lock

      # workflow reads `nixConfig` and uses `--inputs-from .`, so changes to them may affect the result
      - flake.nix
      - flake.lock

  pull_request:
    branches: *branches

    paths: *paths

  workflow_dispatch:

jobs:
  build:
    permissions:
      id-token: write # required so niks3 can authenticate via oidc

    concurrency:
      # one run per ref; latest cancels older runs
      group: ${{ github.workflow }}-${{ github.ref }}

      cancel-in-progress: true

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hilorioze/nixos-dotfiles/.github/actions/setup-nix@main

      - uses: hilorioze/nixos-dotfiles/.github/actions/setup-niks3@main

      - run: nix build --no-link --print-build-logs .#default
