on:
  push:
    branches: &branches
      - main

    paths: &paths
      - .github/workflows/build-devenv.yaml

      - devenv.nix
      - devenv.yaml
      - devenv.lock

      # the shared workflow reads `nixConfig`, so changes to it may affect the result
      - flake.nix

  pull_request:
    branches: *branches

    paths: *paths

  workflow_dispatch:

jobs:
  build-devenv:
    permissions:
      id-token: write # required so niks3 can authenticate via oidc

    uses: hilorioze/nixos-dotfiles/.github/workflows/build-devenv.yaml@main
