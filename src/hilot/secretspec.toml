#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "hilot"
revision = "1.0"

[profiles.default]
SESSION_STRING = {description = "telegram session string from `hilot-login`"}

NATS__TOKEN = {description = "nats authorization token"}
S3__ACCESS_KEY_ID = {description = "s3 access key id"}
S3__SECRET_ACCESS_KEY = {description = "s3 secret access key"}

COOKIES__KEYS = {description = "json list of fernet keys for the cookies, the first one encrypts"}
DOWNLOADER__PROXY = {description = "proxy url for the downloads", required = false}

# the keys of the devenv services
[profiles.development]
NATS__TOKEN = {default = "hilot"}
S3__ACCESS_KEY_ID = {default = "GK46f7300711cd187ca6509d8c"}
S3__SECRET_ACCESS_KEY = {default = "407c73910872f207cd80faa0eab38e171baecaaa7c3bbda9f958994b572e0e8f"}

[scopes]
bot = {secrets = ["SESSION_STRING", "NATS__TOKEN", "S3__ACCESS_KEY_ID", "S3__SECRET_ACCESS_KEY"]}
downloader = {secrets = ["NATS__TOKEN", "S3__ACCESS_KEY_ID", "S3__SECRET_ACCESS_KEY", "COOKIES__KEYS", "DOWNLOADER__PROXY"]}
transcoder = {secrets = ["NATS__TOKEN", "S3__ACCESS_KEY_ID", "S3__SECRET_ACCESS_KEY"]}

cookies = {secrets = ["COOKIES__KEYS"]}
