[format.rules]
# uv writes the arrays of `pyproject.toml` with 4 spaces
indent-width = 4

inline-table-brace-space-width = 0

trailing-comment-alignment = true
trailing-comment-space-width = 1

# the keys and arrays keep their written order; keep-sorted sorts the marked ones
[schema]
format.rules = {array-values-order.enabled = false, table-keys-order.enabled = false}
